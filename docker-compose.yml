services:
  postgres:
    image: postgres:16-alpine
    container_name: vitanexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vitanexus
      POSTGRES_USER: vitanexus
      POSTGRES_PASSWORD: vitanexus_dev_password
    ports:
      - "5432:5432"
    volumes:
      - vitanexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitanexus -d vitanexus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vitanexus_postgres_data:
